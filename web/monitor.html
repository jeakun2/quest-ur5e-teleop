<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleop Monitor</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e5e7eb; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  .state { font-size: 28px; font-weight: 800; padding: 10px 14px; border-radius: 10px; background: #1f2937; }
  .state.engaged { background: #14532d; } .state.bad { background: #7f1d1d; } .state.play { background: #1e3a8a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .card { background: #1f2937; border-radius: 10px; padding: 10px 12px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; color: #9ca3af; text-transform: uppercase; letter-spacing: .04em; }
  button { font-size: 15px; padding: 8px 12px; margin: 3px 4px 3px 0; border-radius: 8px; border: 0; background: #374151; color: #fff; cursor: pointer; }
  button.on { background: #b45309; } button.rec { background: #b91c1c; } button.primary { background: #2563eb; }
  button.danger { background: #991b1b; }
  .mono { font-family: ui-monospace, monospace; font-size: 14px; }
  #flow { white-space: pre-wrap; line-height: 1.5; }
  #menu .item { padding: 2px 8px; border-radius: 6px; display: flex; justify-content: space-between; }
  #menu .item.sel { background: #1d4ed8; }
  .msg { color: #93c5fd; min-height: 1.4em; margin-top: 8px; }
  small { color: #9ca3af; }
</style>
</head>
<body>
<main>
  <h1>Quest → UR5e 모니터 <small id="ws">connecting…</small></h1>
  <div class="state" id="state">—</div>
  <div class="msg" id="msg"></div>
  <div class="card" style="margin-top:12px"><h2>로봇</h2>
    <div class="mono" id="tcp">TCP –</div>
    <div class="mono">rot <span id="rot">–</span> · scale <span id="scale">–</span> · yaw <span id="yaw">–</span>° · 매핑 <span id="mapmode">–</span></div>
    <div class="mono">UI 모드 <span id="mode">–</span> (<span id="modecfg">–</span>)</div>
    <div>
      <button data-cmd='{"cmd":"ui_mode","value":"auto"}'>auto</button>
      <button data-cmd='{"cmd":"ui_mode","value":"headless"}'>headless</button>
      <button data-cmd='{"cmd":"ui_mode","value":"hmd"}'>hmd</button>
    </div>
  </div>
  <div class="grid">
    <div class="card"><h2>동작</h2>
      <button class="primary" data-cmd='{"cmd":"home"}'>초기 자세로</button>
      <button class="danger" data-cmd='{"cmd":"scene_reset"}'>Isaac 씬 초기화</button>
      <button data-cmd='{"cmd":"rot"}'>회전 추종 토글</button>
    </div>
    <div class="card"><h2>보정</h2>
      <button data-cmd='{"cmd":"tutorial"}'>튜토리얼</button>
      <button class="primary" data-cmd='{"cmd":"calib"}'>보정 (방향+위치)</button>
      <button data-cmd='{"cmd":"calib3"}'>정밀 보정 (3축)</button>
    </div>
    <div class="card"><h2>축 고정</h2>
      <button id="lock_x" data-cmd='{"cmd":"lock","axis":"x"}'>X</button>
      <button id="lock_y" data-cmd='{"cmd":"lock","axis":"y"}'>Y</button>
      <button id="lock_z" data-cmd='{"cmd":"lock","axis":"z"}'>Z</button>
      <button id="lock_rot" data-cmd='{"cmd":"lock","axis":"rot"}'>회전</button>
    </div>
    <div class="card"><h2>녹화 · 매핑</h2>
      <button id="rec" data-cmd='{"cmd":"record"}'>● 녹화 시작</button>
      <button data-cmd='{"cmd":"replay"}'>▶ 마지막 녹화 재생</button>
      <button data-cmd='{"cmd":"replay","speed":0.5}'>▶ 0.5x</button>
      <button class="danger" data-cmd='{"cmd":"stop"}'>■ 중단</button>
      <div class="mono" id="recinfo"></div>
      <h2 style="margin-top:8px">이동 배율</h2>
      <button data-cmd='{"cmd":"scale","value":0.25}'>x0.25</button>
      <button data-cmd='{"cmd":"scale","value":0.5}'>x0.5</button>
      <button data-cmd='{"cmd":"scale","value":1.0}'>x1</button>
      <button data-cmd='{"cmd":"scale","value":1.5}'>x1.5</button>
      <h2 style="margin-top:8px">매핑</h2>
      <button data-cmd='{"cmd":"map_mode","value":"relative"}'>상대(래칫)</button>
      <button data-cmd='{"cmd":"map_mode","value":"absolute"}'>절대</button>
    </div>
    <div class="card"><h2>Isaac 카메라 · 시점</h2>
      <button data-cmd='{"cmd":"cam","name":"ceiling"}'>천장 카메라</button>
      <button data-cmd='{"cmd":"cam","name":"side"}'>사이드 카메라</button>
      <button data-cmd='{"cmd":"cam","name":"ee"}'>EE 카메라</button>
      <button data-cmd='{"cmd":"view"}'>Isaac 시점 전환</button>
    </div>
    <div class="card"><h2>AR</h2>
      <button data-cmd='{"cmd":"ghost"}'>홀로그램 손에 맞추기</button>
      <button data-cmd='{"cmd":"ghost","hide":true}'>홀로그램 숨김</button>
      <button data-cmd='{"cmd":"ghost_move"}'>홀로그램 옮기기</button>
      <button data-cmd='{"cmd":"ghost_move","stop":true}'>옮기기 완료</button>
      <button data-cmd='{"cmd":"path_clear"}'>경로 지우기</button>
    </div>
    <div class="card"><h2>컨트롤러 대신</h2>
      <button data-cmd='{"cmd":"confirm"}'>A 확인</button>
      <button data-cmd='{"cmd":"cancel"}'>B 취소</button>
      <button data-cmd='{"cmd":"trigger"}'>트리거</button>
      <button data-cmd='{"cmd":"menu"}'>메뉴</button>
      <button data-cmd='{"cmd":"up"}'>▲</button>
      <button data-cmd='{"cmd":"down"}'>▼</button>
      <button data-cmd='{"cmd":"select"}'>선택</button>
    </div>
  </div>
  <div class="card" style="margin-top:10px"><h2>진행 중</h2><div id="flow">–</div><div id="menu"></div></div>
  <p><small>헤드셋을 벗은 채(헤드리스) 쓸 때는 이 페이지로 상태를 보고 기능을 켜고 끕니다. 그립을 쥔 채 움직이기 =
  이동·회전, 트리거 = 그리퍼, B = 정지. 제스처가 필요한 단계(보정 1·3단계)는 컨트롤러로 수행합니다.</small></p>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let ws, open = false;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { open = true; $('ws').textContent = 'connected'; };
    ws.onclose = () => { open = false; $('ws').textContent = 'closed, retrying…'; setTimeout(connect, 1000); };
    ws.onmessage = (ev) => { let d; try { d = JSON.parse(ev.data); } catch { return; } if (d.type === 'status') render(d); };
  }
  connect();
  document.querySelectorAll('button[data-cmd]').forEach(b => b.onclick = () => {
    if (!open) return; const d = JSON.parse(b.dataset.cmd); d.type = 'cmd'; ws.send(JSON.stringify(d));
  });
  function render(d) {
    const st = $('state'); st.textContent = d.state;
    st.className = 'state ' + (d.state.includes('ENGAGED') ? 'engaged' : d.state.startsWith('UNSAFE') ? 'bad' : d.state.startsWith('PLAYING') ? 'play' : '');
    $('tcp').textContent = 'TCP ' + (d.tcp ? d.tcp.map(v => v.toFixed(3)).join('  ') : '–');
    $('rot').textContent = d.rot ? 'on' : 'off';
    const ui = d.ui || {};
    $('scale').textContent = 'x' + ui.scale; $('yaw').textContent = ui.yaw; $('mapmode').textContent = ui.map_mode;
    $('mode').textContent = ui.mode; $('modecfg').textContent = ui.mode_cfg;
    $('msg').textContent = ui.msg || '';
    for (const k of ['x', 'y', 'z', 'rot']) $('lock_' + k).className = ui.locks && ui.locks[k] ? 'on' : '';
    const rec = $('rec');
    if (ui.recording) { rec.textContent = `■ 녹화 정지 (${ui.recording.seconds}s, ${ui.recording.frames}f)`; rec.className = 'rec'; }
    else { rec.textContent = '● 녹화 시작'; rec.className = ''; }
    $('recinfo').textContent = ui.playing ? `재생 ${ui.playing.path} ${ui.playing.phase} ${(ui.playing.progress * 100).toFixed(0)}%` : '';
    $('flow').textContent = ui.flow ? `${ui.flow.title}\n` + ui.flow.lines.join('\n') : '–';
    $('menu').innerHTML = ui.menu ? ui.menu.items.map(it =>
      `<div class="item${it.sel ? ' sel' : ''}"><span>${it.label}</span><span>${it.value}</span></div>`).join('') : '';
  }
})();
</script>
</body>
</html>
